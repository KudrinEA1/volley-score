# После каждого push в main код уходит на Hugging Face Spaces, и сервер там пересобирается сам.
# Нужны: секрет HF_TOKEN (токен Hugging Face с правом Write) и переменная HF_SPACE (например, имя/volley-score).
name: Обновить сервер на Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отправить код в Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN или HF_SPACE не заданы - пропускаю"; exit 0
          fi
          # Hugging Face не принимает двоичные файлы через обычный git: модель цифр берётся из текстовой копии digit_model_b64.py
          rm -rf .git .github digit_model.npz
          cp hf/README.md README.md && rm -rf hf
          git init -q -b main
          git config user.name "deploy" && git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Из GitHub ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
